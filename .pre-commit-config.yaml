repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
  - repo: local
    hooks:
      - id: check-spec-citations
        name: docs file:line citations still resolve (anti-drift)
        entry: python scripts/check_spec_citations.py
        language: system
        pass_filenames: false
        always_run: true
